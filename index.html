<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新年烟花送祝福</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; background: #000; }
        .start-tip {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 28px; font-weight: bold;
            text-shadow: 0 0 10px #ff0, 0 0 20px #ff0, 0 0 30px #ff0;
            cursor: pointer; z-index: 20;
            transition: all 0.5s ease;
        }
        .start-tip.hide { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(0.8); }
        .running-tip {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 16px; text-shadow: 0 0 5px #ff0;
            z-index: 10; opacity: 0; transition: opacity 0.5s ease;
        }
        .running-tip.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="start-tip" id="startTip">点击这里签收</div>
    <div class="running-tip" id="runningTip">点击可以放烟花呦~</div>
    <canvas id="fireworksCanvas"></canvas>

    <audio id="riseSound" preload="none" style="display: none;" volume="0.05">
        <source src="rise.mp3" type="audio/mpeg">
    
    <audio id="boomSound1" preload="none" style="display: none;" volume="1.0">
        <source src="boom1.mp3" type="audio/mpeg">
    
    <audio id="boomSound2" preload="none" style="display: none;" volume="1.0">
        <source src="boom2.mp3" type="audio/mpeg">
    

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            const startTip = document.getElementById('startTip');
            const runningTip = document.getElementById('runningTip');
            const riseSound = document.getElementById('riseSound');
            const boomSound1 = document.getElementById('boomSound1');
            const boomSound2 = document.getElementById('boomSound2');

            if (!ctx) {
                alert('您的浏览器不支持Canvas，无法显示烟花效果');
                return;
            }

            let isStarted = false;
            let isFirstFireworkDone = false;
            let autoTimer = null;
            let riseTrailPoints = [];
            let riseInterval = null;
            let firstFireworkX = canvas.width / 2;
            let explodeHeight = canvas.height / 2;

            // 新增：轨迹最大长度限制（核心修改）
            const MAX_TRAIL_LENGTH = 20; // 只保留最近20个轨迹粒子，可调整

            const wishList = [
                "新年快乐", "万事顺意", "朝朝暮暮", "一生被爱", "平安喜乐",
                "前程似锦", "笑口常开", "心想事成", "喜乐无忧", "与你同喜",
                "小薄同学", "小薄同学", "小薄同学", "小薄同学", "小薄同学"
            ];
            let wishTexts = [];

            const openingTexts = [
                { text: "很高兴在今年遇见你", sizeRatio: 0.05, duration: 2500 },
                { text: "时间的故事一定会更精彩", sizeRatio: 0.05, duration: 2500 },
                { text: "此刻我想对你说四个字", sizeRatio: 0.05, duration: 2500 },
                {
                    text: "新年快乐！~",
                    sizeRatio: 0.08,
                    duration: 3000,
                    subText: "还有烟花哟~",
                    subSizeRatio: 0.03
                }
            ];
            let currentOpeningTextIndex = 0;
            let isShowingOpeningText = false;
            let openingTextObj = null;

            let stars = [];
            let rings = [];
            let newParticles = [];
            let heartPoints = [];
            let isConverging = false;
            let convergeParticles = [];

            const RISE_DURATION = 3000;
            const TRAIL_DECAY = 0.2; // 调大衰减速度，让轨迹更快消失
            // 全局默认文字衰减（不影响开场四字）
            const TEXT_DECAY = 0.01;
            // 开场四字专属配置（核心新增）
            const OPENING_WORD_SIZE_RATIO = 0.05; // 开场字尺寸
            const OPENING_WORD_DECAY = 0.005;     // 开场字衰减
            let particles = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                firstFireworkX = canvas.width / 2;
                explodeHeight = canvas.height / 2;
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                initStars();
                generateHeartPoints();
            }

            function generateHeartPoints() {
                heartPoints = [];
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const scale = Math.min(canvas.width, canvas.height) * 0.012;
                for (let t = 0; t < Math.PI * 2; t += 0.05) {
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    heartPoints.push({ x: centerX + x * scale, y: centerY + y * scale });
                }
                for (let t = 0; t < Math.PI * 2; t += 0.1) {
                    const x = 16 * Math.pow(Math.sin(t), 3) * 0.8;
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.8;
                    heartPoints.push({ x: centerX + x * scale, y: centerY + y * scale });
                }
            }

            function initStars() {
                stars = [];
                for (let i = 0; i < 100; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 1.2,
                        opacity: Math.random(),
                        speed: 0.005 + Math.random() * 0.015
                    });
                }
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function random(min, max) { return Math.random() * (max - min) + min; }
            function getRandomWish() { return wishList[Math.floor(random(0, wishList.length))]; }
            // 普通文字尺寸（保持原有逻辑）
            function getAdaptedTextSize() {
                const minSize = Math.min(canvas.width, canvas.height) * 0.025;
                const maxSize = Math.min(canvas.width, canvas.height) * 0.04;
                return random(minSize, maxSize);
            }
            function randomColor() {
                const colors = ['#ff0000', '#ff9900', '#ffff00', '#00ff00', '#0099ff', '#0033ff', '#9900ff', '#ff0099'];
                return colors[Math.floor(random(0, colors.length))];
            }

            let isAudioUnlocked = false;
            function unlockAudioGlobally() {
                if (isAudioUnlocked) return;
                [riseSound, boomSound1, boomSound2].forEach(sound => {
                    if (!sound) return;
                    sound.muted = true;
                    sound.play().then(() => {
                        sound.pause(); sound.muted = false; sound.currentTime = 0;
                        isAudioUnlocked = true;
                    }).catch(() => { });
                });
                document.removeEventListener('click', unlockAudioGlobally);
                document.removeEventListener('touchstart', unlockAudioGlobally);
            }
            document.addEventListener('click', unlockAudioGlobally, { once: true });
            document.addEventListener('touchstart', unlockAudioGlobally, { once: true, passive: true });

            function forcePlayAudio(audio) {
                if (!audio || !isAudioUnlocked) return;
                try { audio.currentTime = 0; audio.play().catch(() => { }); } catch (e) { }
            }
            function playRiseSound() {
                if (riseSound) {
                    riseSound.volume = 0.5;
                    forcePlayAudio(riseSound);
                    setTimeout(() => { riseSound.pause(); riseSound.currentTime = 0; }, RISE_DURATION);
                }
            }
            function playSound(audio, volume = 0.5) {
                if (!audio || !isAudioUnlocked) return;
                audio.currentTime = 0; audio.volume = volume; audio.play().catch(() => { });
            }

            // ===================== 核心修改：心形粒子与文字联动淡出 =====================
            class NewParticle {
                constructor(x, y, color, speed, angle, friction = 0.95, gravity = 0.08, isConverge = false) {
                    this.x = x; this.y = y; this.color = color;
                    this.alpha = 1;
                    this.decay = isConverge ? 0 : random(0.015, 0.025);
                    this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                    this.friction = friction; this.gravity = isConverge ? 0 : gravity;
                    this.history = []; this.isConverge = isConverge;
                    this.targetPoint = null; this.speed = isConverge ? random(1, 2) : speed;

                    this.flashTime = 0;
                    this.isFadingOut = false;
                    this.fadeSpeed = 0.01;
                }

                update() {
                    if (this.isConverge && this.targetPoint) {
                        const dx = this.targetPoint.x - this.x;
                        const dy = this.targetPoint.y - this.y;
                        const dist = Math.hypot(dx, dy);

                        if (dist > 2) {
                            // 还在移动：只位移，不修改透明度
                            this.vx = (dx / dist) * this.speed;
                            this.vy = (dy / dist) * this.speed;
                            this.x += this.vx;
                            this.y += this.vy;
                        } else {
                            // 已到位：固定位置 + 闪烁，仅文字消失后淡出
                            this.x = this.targetPoint.x;
                            this.y = this.targetPoint.y;
                            this.vx = 0; this.vy = 0;

                            // 保持你设定的闪烁范围：0.25 ~ 0.5
                            this.flashTime += 0.08;
                            let flashAlpha = 0.25 + 0.25 * Math.sin(this.flashTime);

                            // 文字消失后触发淡出
                            if (this.isFadingOut) {
                                this.alpha = Math.max(0, flashAlpha - this.fadeSpeed);
                            } else {
                                this.alpha = flashAlpha; // 仅闪烁，不淡出
                            }
                        }
                        return;
                    }

                    // 普通粒子原有逻辑
                    this.history.push({ x: this.x, y: this.y });
                    if (this.history.length > 8) this.history.shift();
                    this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity;
                    this.x += this.vx; this.y += this.vy;
                    this.alpha -= this.decay;
                }

                draw() {
                    if (this.alpha <= 0) return;
                    ctx.save();
                    if (this.history.length > 1 && !this.isConverge) {
                        ctx.beginPath(); ctx.moveTo(this.history[0].x, this.history[0].y);
                        this.history.forEach(p => ctx.lineTo(p.x, p.y));
                        ctx.strokeStyle = this.color; ctx.globalAlpha = this.alpha * 0.5; ctx.lineWidth = 1.2; ctx.stroke();
                    }
                    ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.isConverge ? 3 : 2.5, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            }

            class Ring {
                constructor(x, y, color) { this.x = x; this.y = y; this.color = color; this.radius = 0; this.alpha = 0.6; }
                update() { this.radius += 3; this.alpha -= 0.04; }
                draw() { if (this.alpha <= 0) return; ctx.save(); ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.strokeStyle = this.color; ctx.globalAlpha = this.alpha; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
            }

            function drawStars() {
                stars.forEach(s => {
                    s.opacity += s.speed;
                    if (s.opacity > 1 || s.opacity < 0) s.speed *= -1;
                    ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });
            }

            function updateNewFireworkElements() {
                rings.forEach((r, i) => { r.update(); r.draw(); if (r.alpha <= 0) rings.splice(i, 1); });
                newParticles.forEach((p, i) => {
                    p.update(); p.draw();
                    if (p.alpha <= 0) {
                        newParticles.splice(i, 1);
                        const idx = convergeParticles.indexOf(p);
                        if (idx > -1) convergeParticles.splice(idx, 1);
                    }
                });
                if (isConverging && convergeParticles.length > 0 && heartPoints.length > 0) {
                    convergeParticles.forEach(p => {
                        if (!p.targetPoint) p.targetPoint = heartPoints[Math.floor(random(0, heartPoints.length))];
                    });
                }
            }

            // 核心修改：分两次炸开粒子 + 双色随机 + 层次感
            function createNewFirework(x, y, isHeart = false, customWish = null, isConverge = false, isOpeningWord = false) {
                // 生成两个随机颜色（两次炸开分别用）
                const color1 = randomColor();
                const color2 = randomColor();
                // 圆环也分两次生成，增强层次感
                rings.push(new Ring(x, y, color1));
                setTimeout(() => {
                    rings.push(new Ring(x, y, color2));
                }, 80);
                
                playSound(Math.random() > 0.5 ? boomSound1 : boomSound2, 0.8);
                // 延迟播放第二个爆炸声（可选，增强听觉层次）
                setTimeout(() => {
                    playSound(Math.random() > 0.5 ? boomSound1 : boomSound2, 0.6);
                }, 100);

                // 生成粒子的通用函数
                const generateParticles = (color, count, speedMin, speedMax, angleOffset = 0) => {
                    for (let i = 0; i < count; i++) {
                        if (isHeart || customWish === "小薄同学") {
                            const angle = random(0, Math.PI * 2) + angleOffset;
                            const vx = 16 * Math.pow(Math.sin(angle), 3) * 0.28; // 稍微放大缩放系数，让心形更明显
                            const vy = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * 0.28;
                            const p = new NewParticle(x, y, color, 0, 0, 0.95, 0.04, isConverge);
                            // 直接赋值速度，无任何随机缩放（和开场一致）
                            p.vx = vx;
                            p.vy = vy; 
                            newParticles.push(p);
                            if (isConverge) convergeParticles.push(p);
                        } else {
                            // 普通烟花保留原有逻辑
                            const angle = random(0, Math.PI * 2) + angleOffset;
                            const p = new NewParticle(x, y, color, random(speedMin, speedMax), angle, 0.95, 0.08, isConverge);
                            newParticles.push(p);
                            if (isConverge) convergeParticles.push(p);
                        }
                    }
                };

                // 第一次炸开（60%粒子，速度稍慢，基础角度）
                const firstCount = isHeart || customWish === "小薄同学" ? 72 : 60;
                generateParticles(color1, firstCount, 2, 5);

                // 第二次炸开（40%粒子，延迟100ms，速度稍快，角度偏移增加层次）
                const secondCount = isHeart || customWish === "小薄同学" ? 48 : 40;
                if (isHeart || customWish === "小薄同学") {
                    generateParticles(color2, secondCount, 4, 8); // 无角度偏移
                } else {
                    generateParticles(color2, secondCount, 4, 8, Math.PI / 8); // 普通烟花保留偏移
                }

                // 传递isOpeningWord参数给文字创建函数
                createWishText(x, y, `hsl(${random(0, 360)},100%,85%)`, customWish || getRandomWish(), isOpeningWord);
            }

            class Particle {
                constructor(x, y, color, size = 3, decay = random(0.018, 0.025), isHighlight = false) {
                    this.x = x; this.y = y; this.color = color; this.size = size; this.alpha = 1; this.decay = decay; this.vx = 0; this.vy = 0; this.isHighlight = isHighlight; this.flashSpeed = isHighlight ? random(0.02, 0.04) : 0;
                }
                update() { this.x += this.vx; this.y += this.vy; this.alpha = Math.max(0, this.alpha - this.decay + (this.isHighlight ? Math.sin(Date.now() * 0.005) * this.flashSpeed : 0)); this.vy += 0.03; }
                draw() { if (this.alpha <= 0) return; ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color; if (this.isHighlight) { ctx.shadowBlur = 4; ctx.shadowColor = this.color; } ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
            }

            // 核心修改：新增isOpeningWord参数，单独配置开场四字的尺寸和衰减
            function createWishText(x, y, color, text, isOpeningWord = false) {
                let size, decayRate;
                if (isOpeningWord) {
                    // 开场四字专属尺寸
                    size = Math.min(canvas.width, canvas.height) * OPENING_WORD_SIZE_RATIO;
                    // 开场四字专属衰减
                    decayRate = OPENING_WORD_DECAY;
                } else {
                    // 普通文字保持原有逻辑
                    size = getAdaptedTextSize();
                    decayRate = TEXT_DECAY;
                }
                wishTexts.push({ x, y, text, alpha: 1, color, size, decayRate });
            }

            function drawWishText(t) { 
                if (t.alpha <= 0) return; 
                ctx.save(); 
                ctx.globalAlpha = t.alpha; 
                ctx.font = `bold ${t.size}px PingFang SC, Microsoft YaHei, sans-serif`; 
                ctx.textAlign = 'center'; 
                ctx.textBaseline = 'middle'; 
                ctx.fillStyle = t.color; 
                ctx.shadowBlur = 6; 
                ctx.shadowColor = t.color; 
                ctx.fillText(t.text, t.x, t.y); 
                ctx.restore(); 
            }

            // 核心修改：使用每个文字自己的decayRate（开场四字用慢衰减，普通文字用默认）
            function updateWishTexts() { 
                wishTexts.forEach((t, i) => { 
                    t.alpha = Math.max(0, t.alpha - t.decayRate); 
                    drawWishText(t); 
                    if (t.alpha <= 0) wishTexts.splice(i, 1); 
                }); 
            }

            function drawOpeningText() {
                if (!openingTextObj) return;
                ctx.save();
                ctx.globalAlpha = openingTextObj.alpha;
                const fontSize = Math.min(canvas.width, canvas.height) * openingTextObj.sizeRatio;
                ctx.font = `bold ${fontSize}px PingFang SC, Microsoft YaHei, sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#ffcc00';
                ctx.fillText(openingTextObj.text, canvas.width / 2, canvas.height / 2);
                if (openingTextObj.subText) {
                    const subSize = Math.min(canvas.width, canvas.height) * openingTextObj.subSizeRatio;
                    ctx.font = `bold ${subSize}px PingFang SC, Microsoft YaHei, sans-serif`;
                    ctx.fillText(openingTextObj.subText, canvas.width / 2, canvas.height / 2 + (fontSize + subSize) * 1.2 / 2);
                }
                ctx.restore();

                if (openingTextObj.isFadingIn) {
                    openingTextObj.alpha += 0.01;
                    if (openingTextObj.alpha >= 1) {
                        openingTextObj.isFadingIn = false;
                        setTimeout(() => openingTextObj.isFadingOut = true, openingTextObj.duration);
                    }
                } else if (openingTextObj.isFadingOut) {
                    openingTextObj.alpha -= 0.01;
                    if (openingTextObj.alpha <= 0) {
                        openingTextObj = null;
                        currentOpeningTextIndex++;
                        if (currentOpeningTextIndex < openingTexts.length) {
                            showNextOpeningText();
                        } else {
                            // 所有文字消失：触发心形粒子淡出
                            isShowingOpeningText = false;
                            // 核心：遍历所有心形粒子，开启淡出
                            convergeParticles.forEach(p => p.isFadingOut = true);
                            startAutoFirework();
                            runningTip.classList.add('show');
                        }
                    }
                }
            }

            function showNextOpeningText() {
                const cfg = openingTexts[currentOpeningTextIndex];
                openingTextObj = {
                    text: cfg.text, sizeRatio: cfg.sizeRatio, duration: cfg.duration,
                    subText: cfg.subText || '', subSizeRatio: cfg.subSizeRatio || 0,
                    alpha: 0, isFadingIn: true, isFadingOut: false
                };
            }

            function startOpeningTextAnimation() {
                isShowingOpeningText = true;
                currentOpeningTextIndex = 0;
                showNextOpeningText();
            }

            // 核心修改：限制轨迹长度 + 优化轨迹更新
            function updateRiseTrail() { 
                // 先更新所有轨迹粒子，移除透明度为0的
                riseTrailPoints = riseTrailPoints.filter(p => {
                    p.update();
                    return p.alpha > 0;
                });
                // 限制轨迹最大长度，超出则删除最旧的粒子
                if (riseTrailPoints.length > MAX_TRAIL_LENGTH) {
                    riseTrailPoints.splice(0, riseTrailPoints.length - MAX_TRAIL_LENGTH);
                }
                // 绘制剩余的轨迹粒子
                riseTrailPoints.forEach(p => p.draw()); 
            }

            function clearRiseTrail() { 
                riseTrailPoints = []; 
                if (riseInterval) { 
                    clearInterval(riseInterval); 
                    riseInterval = null; 
                } 
            }

            function createAutoFireworkBatch() {
                if (!isFirstFireworkDone || isShowingOpeningText) return;
                const count = Math.floor(random(3, 5));
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const x = random(canvas.width * 0.1, canvas.width * 0.9);
                        const y = random(canvas.height * 0.2, canvas.height * 0.7);
                        const wish = getRandomWish();
                        const isHeartWish = wish === "小薄同学";
                        // 关键：isConverge=false（不汇聚），isHeart=isHeartWish（启用心形粒子逻辑）
                        createNewFirework(x, y, isHeartWish, wish, false, false);
                    }, random(50, 200) * i);
                }
            }

            function startAutoFirework() { createAutoFireworkBatch(); autoTimer = setInterval(createAutoFireworkBatch, random(2000, 3500)); }

            function startFirstHeartFirework() {
                convergeParticles = []; 
                isConverging = false;
                let completedFireworkCount = 0;
                const TOTAL_FIRST_FIREWORKS = 4;

                // 核心：固定 4 个不同高度（从低 → 高，速度相同则依次炸开）
                const heights = [0.45, 0.5, 0.35, 0.4]; 
                const speedratios = [1.1, 0.9, 1.1, 0.9];
                const positions = [
                    {x: canvas.width*0.2, text: "小", isConverge: true, isHeart: false},
                    {x: canvas.width*0.4, text: "薄", isConverge: true, isHeart: true},
                    {x: canvas.width*0.6, text: "同", isConverge: true, isHeart: true},
                    {x: canvas.width*0.8, text: "学", isConverge: true, isHeart: false}
                ];

                // 统一上升速度（所有烟花完全一样，保证公平）
                const baseTargetY = canvas.height * 0.35; // 用最高处算基准速度
                const riseSpeed = (canvas.height - baseTargetY) / 4500 * 16;

                positions.forEach((pos, index) => {
                    let currentY = canvas.height;
                    const targetX = pos.x;
                    // 按序号取不同高度：index 0 最低，index 3 最高
                    const targetY = canvas.height * heights[index];
                    
                    playRiseSound();
                    
                    const localInterval = setInterval(() => {
                        currentY -= riseSpeed * speedratios[index];
                        riseTrailPoints.push(new Particle(targetX, currentY, '#ffcc00', 1, TRAIL_DECAY));
                        
                        if (currentY <= targetY) {
                            clearInterval(localInterval);
                            riseTrailPoints = riseTrailPoints.filter(p => Math.abs(p.x - targetX) > 5);
                            createNewFirework(targetX, targetY, pos.isHeart, pos.text, pos.isConverge, true);
                            
                            completedFireworkCount++;
                            if (completedFireworkCount === TOTAL_FIRST_FIREWORKS) {
                                setTimeout(() => {
                                    isConverging = true;
                                    setTimeout(() => {
                                        isFirstFireworkDone = true;
                                        startOpeningTextAnimation();
                                    }, 2000);
                                }, 1000);
                            }
                        }
                    }, 16);
                });
            }

            function clickToFirework(x, y) { 
                if (!isStarted || !isFirstFireworkDone || isShowingOpeningText) return; 
                const wish = getRandomWish();
                const isHeartWish = wish === "小薄同学";
                // 关键：isConverge=false（不汇聚），isHeart=isHeartWish（启用心形粒子逻辑）
                createNewFirework(x, y, isHeartWish, wish, false, false); 
            }

            function animate() {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawStars();
                // 核心修改：调用优化后的轨迹更新函数
                updateRiseTrail();
                particles.forEach((p, i) => { p.update(); p.draw(); if (p.alpha <= 0) particles.splice(i, 1); });
                updateNewFireworkElements();
                updateWishTexts();
                if (isShowingOpeningText) drawOpeningText();
                requestAnimationFrame(animate);
            }
            animate();

            function startAll() { if (isStarted) return; isStarted = true; startTip.classList.add('hide'); unlockAudioGlobally(); setTimeout(startFirstHeartFirework, 300); }
            startTip.addEventListener('click', startAll);
            canvas.addEventListener('click', e => isStarted && clickToFirework(e.clientX, e.clientY));
            canvas.addEventListener('touchstart', e => { e.preventDefault(); isStarted && clickToFirework(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        });
    </script>
</body>
</html>
